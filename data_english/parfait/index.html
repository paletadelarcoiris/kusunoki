<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍨 PARFAIT MAKER 🍨</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fef0f4;
            color: #4a148c;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        #parfait-canvas-container {
            position: relative;
            width: 400px;
            height: 600px;
            background-color: #ffffff;
            border: 4px solid #f8bbd0;
            border-radius: 15px;
            overflow: hidden;
        }
        .layer-item {
            position: absolute;
            cursor: move;
            user-select: none;
        }
        #glass-layer {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
            max-width: 90%;
        }
        .panel {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h3 {
            margin-top: 15px;
            margin-bottom: 8px;
            border-bottom: 2px solid #f8bbd0;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        button {
            padding: 10px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            background-color: #f8bbd0;
            color: #4a148c;
            cursor: pointer;
            font-weight: bold;
        }
        .action-btns {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .action-btns button {
            flex: 1;
        }
        .conversation-box {
            margin-top: 20px;
            padding: 12px;
            background-color: #f3e5f5;
            border-left: 5px solid #ab47bc;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>🍨 PARFAIT MAKER 🍨</h1>

    <div class="main-container">
        <div id="parfait-canvas-container">
            <!-- 自動加工されたグラス画像がここに入ります -->
            <img id="glass-layer" alt="Glass">
        </div>

        <div class="panel">
            <h3>トッピングを選ぶ</h3>
            <div class="btn-grid">
                <button onclick="addIngredient('Strawberry')">Strawberry</button>
                <button onclick="addIngredient('Banana')">Banana</button>
                <button onclick="addIngredient('Ice Cream')">Ice Cream</button>
                <button onclick="addIngredient('Cream')">Cream</button>
                <button onclick="addIngredient('Cherry')">Cherry</button>
                <button onclick="addIngredient('Chocolate')">Chocolate</button>
                <button onclick="addIngredient('Cookie')">Cookie</button>
                <button onclick="addIngredient('Mint')">Mint</button>
                <button onclick="addIngredient('Blueberry')">Blueberry</button>
                <button onclick="addIngredient('Wafer')">Wafer</button>
            </div>

            <h3>サイズ / 回転</h3>
            <div class="action-btns">
                <button onclick="changeSize(1.1)">➕ Bigger</button>
                <button onclick="changeSize(0.9)">➖ Smaller</button>
                <button onclick="rotateIngredient()">🔄 Rotate</button>
            </div>

            <h3>管理</h3>
            <div class="action-btns">
                <button onclick="deleteSelected()">🗑 Delete</button>
                <button onclick="clearCanvas()">✨ Clear</button>
                <button onclick="saveParfait()">💾 Save</button>
            </div>

            <div class="conversation-box">
                <strong>💬 Conversation Box</strong><br>
                Color: <span id="status-color">Default</span><br>
                Size: <span id="status-size">中 (M)</span>
            </div>
        </div>
    </div>

    <!-- JavaScriptファイルを読み込むリンク -->
    <script src="script.js"></script>
</body>
</html>
