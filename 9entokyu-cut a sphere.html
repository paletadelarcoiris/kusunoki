<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球を切ってみよう！</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      user-select: none;
      background-color: #f2ebf7;
      color: #333;
    }
    #ui-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-width: 320px;
    }
    h1 {
      font-size: 17px;
      margin: 0 0 10px 0;
      text-align: center;
      color: #2c3e50;
    }
    .instruction {
      font-size: 12px;
      color: #555;
      margin-bottom: 12px;
      line-height: 1.5;
      background: #f8f9fa;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .mode-toggle {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 4px;
      border: 2px solid #3498db;
      border-radius: 8px;
      background: #fff;
      color: #3498db;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.active {
      background: #3498db;
      color: #fff;
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #34495e;
      margin: 8px 0 6px 0;
    }
    .grid-btns {
      display: grid;
      grid-system: 1fr 1fr;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn.active {
      border-color: #2ecc71;
      background: #e8f8f5;
      color: #27ae60;
    }
    .btn-reset {
      width: 100%;
      background: #e74c3c;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }
    .btn-reset:active { background: #c0392b; }
    #cut-line-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <canvas id="cut-line-canvas"></canvas>

  <div id="ui-container">
    <h1>球のいろいろなところを切ってみよう！</h1>
    
    <div class="mode-toggle">
      <button id="btn-mode-rotate" class="mode-btn active" onclick="setInterMode('rotate')">🔄 観察（まわす）</button>
      <button id="btn-mode-cut" class="mode-btn" onclick="setInterMode('cut')">🔪 ナイフ（きる）</button>
    </div>

    <div class="instruction" id="mode-desc">
      画面をドラッグして球をいろんな方向から見ることができます。
    </div>

    <div class="section-title">もよう（種類）を選ぶ</div>
    <div class="grid-btns">
      <button class="btn active" id="btn-watermelon" onclick="changeTexture('watermelon')">🍉 スイカ</button>
      <button class="btn" id="btn-baseball" onclick="changeTexture('baseball')">⚾ 野球ボール</button>
      <button class="btn" id="btn-soccer" onclick="changeTexture('soccer')">⚽ サッカーボール</button>
      <button class="btn" id="btn-earth" onclick="changeTexture('earth')">🌍 地球</button>
    </div>

    <button class="btn-reset" onclick="resetCut()">もとにもどす</button>
  </div>

  <script>
    // --- 1. シーン・カメラ・レンダラーの設定 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf2ebf7);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.localClippingEnabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // ナイフ描画用 Canvas
    const lineCanvas = document.getElementById('cut-line-canvas');
    const lineCtx = lineCanvas.getContext('2d');
    function resizeLineCanvas() {
      lineCanvas.width = window.innerWidth;
      lineCanvas.height = window.innerHeight;
    }
    resizeLineCanvas();
    window.addEventListener('resize', resizeLineCanvas);

    // ライティング
    const ambLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambLight);
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    const R = 2; // 球の半径
    let currentType = 'watermelon';
    let currentPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), R + 1);

    let sphereGroup = new THREE.Group();
    scene.add(sphereGroup);
    let capMesh = null, lineMesh = null;

    // --- 2. 2Dテクスチャ生成 ---
    
    // 地球テクスチャ
    function generateCleanEarthTexture() {
      const cv = document.createElement('canvas');
      cv.width = 2048; cv.height = 1024;
      const ctx = cv.getContext('2d');

      const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
      oceanGrad.addColorStop(0, '#0a2342');
      oceanGrad.addColorStop(0.5, '#123e6d');
      oceanGrad.addColorStop(1, '#0a2342');
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, 2048, 1024);

      function drawPath(coords, color = '#27ae60') {
        ctx.fillStyle = color;
        ctx.beginPath();
        coords.forEach(([x, y], i) => {
          const px = ((x + 180) / 360) * 2048;
          const py = ((90 - y) / 180) * 1024;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.closePath();
        ctx.fill();
      }

      // 大陸
      // ユーラシア
      drawPath([
        [-10, 35], [10, 36], [30, 31], [45, 12], [75, 10], [100, 5], [105, 20],
        [120, 22], [122, 30], [140, 35], [142, 50], [170, 60], [180, 66], [170, 70],
        [100, 75], [60, 70], [30, 70], [10, 60], [-10, 60], [-10, 35]
      ]);
      // アフリカ
      drawPath([
        [-17, 15], [12, 37], [32, 31], [43, 12], [51, 11], [40, -10],
        [35, -25], [20, -35], [15, -30], [10, 0], [-15, 5], [-17, 15]
      ]);
      // 北アメリカ
      drawPath([
        [-168, 65], [-140, 60], [-125, 48], [-120, 34], [-105, 20], [-90, 16],
        [-80, 25], [-75, 35], [-64, 45], [-55, 50], [-65, 65], [-85, 70],
        [-120, 72], [-168, 65]
      ]);
      // 中央アメリカ（パナマ地峡）
      drawPath([
        [-105, 20], [-90, 16], [-85, 13], [-80, 9], [-77, 8],
        [-80, 8], [-85, 10], [-90, 18]
      ]);
      // 南アメリカ
      drawPath([
        [-80, 8], [-70, 12], [-60, -5], [-35, -5], [-38, -20], [-50, -35],
        [-68, -55], [-75, -45], [-80, -18], [-80, 8]
      ]);
      // オーストラリア
      drawPath([
        [113, -22], [130, -12], [142, -11], [153, -28], [148, -38], [115, -35]
      ]);

      // 南極（白色）
      drawPath([
        [-180, -65], [180, -65], [180, -90], [-180, -90]
      ], '#ffffff');

      // 日本列島
      const jpColor = '#2ecc71';
      drawPath([[145.5, 45.5], [150.5, 45], [151, 43], [147, 42], [145.3, 41.5], [145.5, 43]], jpColor);
      drawPath([[146.5, 41], [147.5, 38.3], [146.3, 35.7], [145.3, 35], [142.3, 34.7], [138.5, 34.3], [136.5, 34], [138, 34.8], [141.5, 36.5], [144.5, 37.5], [146, 40]], jpColor);
      drawPath([[140, 34.2], [140.2, 33.5], [137.7, 32.9], [137.5, 33.5]], jpColor);
      drawPath([[137.3, 33.9], [137.5, 32.5], [136, 31.2], [135.7, 32.5], [135.3, 33.5]], jpColor);

      // 緯度・経度線
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.setLineDash([6, 6]);

      for (let lat = -60; lat <= 60; lat += 30) {
        if (lat === 0) continue;
        const y = ((90 - lat) / 180) * 1024;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(2048, y); ctx.stroke();
      }
      for (let lon = -180; lon < 180; lon += 30) {
        const x = ((lon + 180) / 360) * 2048;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024); ctx.stroke();
      }

      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255, 221, 87, 0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 512); ctx.lineTo(2048, 512); ctx.stroke();

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // 野球ボールテクスチャ
    function generateBaseballTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 512;
      const ctx = cv.getContext('2d');

      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(0, 0, 1024, 512);

      ctx.strokeStyle = '#c0392b';
      ctx.lineWidth = 8;
      ctx.setLineDash([12, 12]);
      
      ctx.beginPath();
      ctx.moveTo(0, 150);
      ctx.bezierCurveTo(256, 300, 768, 0, 1024, 150);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 362);
      ctx.bezierCurveTo(256, 512, 768, 212, 1024, 362);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // スイカ外皮テクスチャ
    function generateWatermelonTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#27ae60'; ctx.fillRect(0, 0, 1024, 512);
      ctx.fillStyle = '#145a32';
      for (let x = 0; x < 1024; x += 120) {
        ctx.beginPath(); ctx.moveTo(x, 0);
        for (let y = 0; y <= 512; y += 20) {
          ctx.lineTo(x + Math.sin(y * 0.05) * 25 + 30, y);
        }
        for (let y = 512; y >= 0; y -= 20) {
          ctx.lineTo(x + Math.sin(y * 0.05) * 25, y);
        }
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // --- 各種類の断面テクスチャ生成 ---
    function generateInnerTexture(type) {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      const center = 256;

      if (type === 'watermelon') {
        // 皮と果肉
        ctx.fillStyle = '#27ae60'; ctx.fillRect(0, 0, 512, 512);
        ctx.fillStyle = '#eafaf1'; ctx.beginPath(); ctx.arc(center, center, 242, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(center, center, 230, 0, Math.PI * 2); ctx.fill();
        
        // とがった先端（(0,-10)）を中心（(0,0)）に向ける関数
        function drawWatermelonSeed(cx, cy, angle) {
          ctx.save();
          ctx.translate(cx, cy);
          // (cx, cy) から中心 (center, center) へのベクトル方向と合わせる
          ctx.rotate(angle - Math.PI / 2);

          ctx.fillStyle = '#2c3e50';
          ctx.beginPath();
          // (0, -10) がとがった先端、(0, 10) が丸いお尻
          ctx.moveTo(0, -10);
          ctx.bezierCurveTo(6, -2, 7, 7, 0, 10);
          ctx.bezierCurveTo(-7, 7, -6, -2, 0, -10);
          ctx.fill();

          ctx.restore();
        }

        // 3層に配置
        const layers = [
          { count: 6, radius: 90 },
          { count: 10, radius: 145 },
          { count: 12, radius: 190 }
        ];

        layers.forEach((layer, layerIdx) => {
          const offsetAngle = (layerIdx % 2 === 1) ? (Math.PI / layer.count) : 0;
          for (let i = 0; i < layer.count; i++) {
            const angle = (i / layer.count) * Math.PI * 2 + offsetAngle;
            const sx = center + Math.cos(angle) * layer.radius;
            const sy = center + Math.sin(angle) * layer.radius;
            drawWatermelonSeed(sx, sy, angle);
          }
        });
      } 
      else if (type === 'earth') {
        ctx.fillStyle = '#8d5b4c';
        ctx.fillRect(0, 0, 512, 512);

        const mantleGrad = ctx.createRadialGradient(center, center, 110, center, center, 245);
        mantleGrad.addColorStop(0, '#ff4500');
        mantleGrad.addColorStop(0.7, '#d32f2f');
        mantleGrad.addColorStop(1, '#8b0000');
        ctx.fillStyle = mantleGrad;
        ctx.beginPath(); ctx.arc(center, center, 245, 0, Math.PI * 2); ctx.fill();

        const outerCoreGrad = ctx.createRadialGradient(center, center, 50, center, center, 110);
        outerCoreGrad.addColorStop(0, '#ffeb3b');
        outerCoreGrad.addColorStop(1, '#ff9800');
        ctx.fillStyle = outerCoreGrad;
        ctx.beginPath(); ctx.arc(center, center, 110, 0, Math.PI * 2); ctx.fill();

        const innerCoreGrad = ctx.createRadialGradient(center, center, 0, center, center, 50);
        innerCoreGrad.addColorStop(0, '#ffffff');
        innerCoreGrad.addColorStop(1, '#fff59d');
        ctx.fillStyle = innerCoreGrad;
        ctx.beginPath(); ctx.arc(center, center, 50, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(center, center, 110, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(center, center, 50, 0, Math.PI * 2); ctx.stroke();
      } 
      else if (type === 'baseball') {
        ctx.fillStyle = '#e0e0e0'; ctx.fillRect(0, 0, 512, 512);

        const yarnGrad = ctx.createRadialGradient(center, center, 70, center, center, 242);
        yarnGrad.addColorStop(0, '#8d6e63');
        yarnGrad.addColorStop(0.5, '#a1887f');
        yarnGrad.addColorStop(1, '#d7ccc8');
        ctx.fillStyle = yarnGrad;
        ctx.beginPath(); ctx.arc(center, center, 242, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = 'rgba(0,0,0,0.08)';
        ctx.lineWidth = 3;
        for (let r = 80; r < 240; r += 15) {
          ctx.beginPath(); ctx.arc(center, center, r, 0, Math.PI * 2); ctx.stroke();
        }

        const coreGrad = ctx.createRadialGradient(center, center, 0, center, center, 70);
        coreGrad.addColorStop(0, '#d4a373');
        coreGrad.addColorStop(0.7, '#bc6c25');
        coreGrad.addColorStop(1, '#2b2d42');
        ctx.fillStyle = coreGrad;
        ctx.beginPath(); ctx.arc(center, center, 70, 0, Math.PI * 2); ctx.fill();
      } 
      else if (type === 'soccer') {
        const soccerGrad = ctx.createRadialGradient(center, center, 0, center, center, 235);
        soccerGrad.addColorStop(0, '#d1d5db');
        soccerGrad.addColorStop(0.6, '#6b7280');
        soccerGrad.addColorStop(1, '#374151');
        
        ctx.fillStyle = soccerGrad;
        ctx.fillRect(0, 0, 512, 512);

        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 14;
        ctx.beginPath(); ctx.arc(center, center, 245, 0, Math.PI * 2); ctx.stroke();

        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(center, center, 238, 0, Math.PI * 2); ctx.stroke();
      }

      return new THREE.CanvasTexture(cv);
    }

    // --- 3. サッカーボール生成 ---
    function createSpherizedSoccerBall(radius) {
      const t = (1.0 + Math.sqrt(5.0)) / 2.0;
      const icoVerts = [
        [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
        [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
        [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]
      ].map(v => new THREE.Vector3(...v).normalize());

      const icoFaces = [
        [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
        [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
        [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
        [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
      ];

      const pentagons = Array.from({length: 12}, () => []);

      icoFaces.forEach((f) => {
        const vA = icoVerts[f[0]], vB = icoVerts[f[1]], vC = icoVerts[f[2]];
        
        const AB1 = new THREE.Vector3().lerpVectors(vA, vB, 1/3).normalize();
        const AB2 = new THREE.Vector3().lerpVectors(vA, vB, 2/3).normalize();
        const BC1 = new THREE.Vector3().lerpVectors(vB, vC, 1/3).normalize();
        const BC2 = new THREE.Vector3().lerpVectors(vB, vC, 2/3).normalize();
        const CA1 = new THREE.Vector3().lerpVectors(vC, vA, 1/3).normalize();
        const CA2 = new THREE.Vector3().lerpVectors(vC, vA, 2/3).normalize();

        addSphericalPolygon([AB1, AB2, BC1, BC2, CA1, CA2], 0xffffff, radius);

        pentagons[f[0]].push(AB1);
        pentagons[f[1]].push(BC1);
        pentagons[f[2]].push(CA1);
      });

      pentagons.forEach((pVerts) => {
        const center = pVerts.reduce((a, b) => a.clone().add(b), new THREE.Vector3()).divideScalar(pVerts.length);
        const normal = center.clone().normalize();
        const v0 = pVerts[0].clone().sub(center).normalize();

        pVerts.sort((a, b) => {
          const va = a.clone().sub(center).normalize();
          const vb = b.clone().sub(center).normalize();
          const angleA = Math.atan2(new THREE.Vector3().crossVectors(v0, va).dot(normal), v0.dot(va));
          const angleB = Math.atan2(new THREE.Vector3().crossVectors(v0, vb).dot(normal), v0.dot(vb));
          return angleA - angleB;
        });

        addSphericalPolygon(pVerts, 0x111111, radius);
      });

      function addSphericalPolygon(polyVerts, colorHex, r) {
        const geom = new THREE.BufferGeometry();
        const positions = [];
        const normals = [];

        const center = polyVerts.reduce((a, b) => a.clone().add(b), new THREE.Vector3()).divideScalar(polyVerts.length).normalize();

        const subDiv = 4;
        for (let i = 0; i < polyVerts.length; i++) {
          const p1 = polyVerts[i];
          const p2 = polyVerts[(i + 1) % polyVerts.length];

          for (let s = 0; s < subDiv; s++) {
            const t1 = s / subDiv;
            const t2 = (s + 1) / subDiv;

            const edgePt1 = new THREE.Vector3().lerpVectors(p1, p2, t1).normalize();
            const edgePt2 = new THREE.Vector3().lerpVectors(p1, p2, t2).normalize();

            const v0 = center.clone().multiplyScalar(r);
            const v1 = edgePt1.clone().multiplyScalar(r);
            const v2 = edgePt2.clone().multiplyScalar(r);

            positions.push(v0.x, v0.y, v0.z,  v1.x, v1.y, v1.z,  v2.x, v2.y, v2.z);

            const n0 = v0.clone().normalize();
            const n1 = v1.clone().normalize();
            const n2 = v2.clone().normalize();
            normals.push(n0.x, n0.y, n0.z,  n1.x, n1.y, n1.z,  n2.x, n2.y, n2.z);
          }
        }

        geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));

        const mat = new THREE.MeshStandardMaterial({
          color: colorHex,
          roughness: 0.3,
          metalness: 0.05,
          side: THREE.DoubleSide,
          clippingPlanes: [currentPlane],
          clipShadows: true
        });

        sphereGroup.add(new THREE.Mesh(geom, mat));
      }
    }

    // --- 4. 3Dモデル構築 ---
    function buildSphere() {
      while(sphereGroup.children.length > 0) {
        sphereGroup.remove(sphereGroup.children[0]);
      }

      const sphereMatParams = {
        side: THREE.DoubleSide,
        clippingPlanes: [currentPlane],
        clipShadows: true,
        roughness: 0.5
      };

      if (currentType === 'watermelon') {
        const geo = new THREE.SphereGeometry(R, 64, 64);
        const mat = new THREE.MeshStandardMaterial({
          ...sphereMatParams,
          map: generateWatermelonTexture()
        });
        sphereGroup.add(new THREE.Mesh(geo, mat));
      } 
      else if (currentType === 'earth') {
        const geo = new THREE.SphereGeometry(R, 64, 64);
        const mat = new THREE.MeshStandardMaterial({
          ...sphereMatParams,
          map: generateCleanEarthTexture()
        });
        sphereGroup.add(new THREE.Mesh(geo, mat));
      } 
      else if (currentType === 'baseball') {
        const geo = new THREE.SphereGeometry(R, 64, 64);
        const mat = new THREE.MeshStandardMaterial({
          ...sphereMatParams,
          map: generateBaseballTexture()
        });
        sphereGroup.add(new THREE.Mesh(geo, mat));
      } 
      else if (currentType === 'soccer') {
        createSpherizedSoccerBall(R);
      }

      updateCutFace();
    }

    function updateCutFace() {
      if (capMesh) sphereGroup.remove(capMesh);
      if (lineMesh) sphereGroup.remove(lineMesh);

      const dist = currentPlane.distanceToPoint(new THREE.Vector3(0, 0, 0));
      if (Math.abs(dist) >= R - 0.001) return;

      const capRadius = Math.sqrt(R * R - dist * dist);
      const capGeo = new THREE.CircleGeometry(capRadius, 64);
      const capMat = new THREE.MeshBasicMaterial({
        map: generateInnerTexture(currentType),
        side: THREE.DoubleSide
      });
      capMesh = new THREE.Mesh(capGeo, capMat);

      const planeNormal = currentPlane.normal.clone().normalize();
      const posOnPlane = planeNormal.clone().multiplyScalar(-currentPlane.constant);
      capMesh.position.copy(posOnPlane);
      capMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), planeNormal);
      sphereGroup.add(capMesh);
    }

    buildSphere();

    // --- 5. インタラクション＆切断コントロール ---
    let interMode = 'rotate';
    let isDrawingCut = false;
    let cutStart = { x: 0, y: 0 };
    let cutEnd = { x: 0, y: 0 };

    window.setInterMode = function(mode) {
      interMode = mode;
      document.getElementById('btn-mode-rotate').classList.toggle('active', mode === 'rotate');
      document.getElementById('btn-mode-cut').classList.toggle('active', mode === 'cut');
      
      const desc = document.getElementById('mode-desc');
      if (mode === 'rotate') {
        controls.enabled = true;
        desc.innerHTML = '👉 <b>観察モード：</b> 球をまわして、切り口をたしかめよう！';
      } else {
        controls.enabled = false;
        desc.innerHTML = '👉 <b>ナイフモード：</b> 球の上をドラッグして、好きなむき（たて・よこ・ななめ）に切ってみよう！';
      }
    };

    window.addEventListener('pointerdown', (e) => {
      if (interMode !== 'cut') return;
      if (e.clientX < 350 && e.clientY < 320) return;

      isDrawingCut = true;
      cutStart = { x: e.clientX, y: e.clientY };
      cutEnd = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDrawingCut) return;
      cutEnd = { x: e.clientX, y: e.clientY };

      lineCtx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
      lineCtx.strokeStyle = '#e74c3c';
      lineCtx.lineWidth = 4;
      lineCtx.setLineDash([8, 8]);
      lineCtx.beginPath();
      lineCtx.moveTo(cutStart.x, cutStart.y);
      lineCtx.lineTo(cutEnd.x, cutEnd.y);
      lineCtx.stroke();
    });

    window.addEventListener('pointerup', () => {
      if (!isDrawingCut) return;
      isDrawingCut = false;
      lineCtx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);

      const dx = cutEnd.x - cutStart.x;
      const dy = cutEnd.y - cutStart.y;
      if (Math.hypot(dx, dy) < 30) return;

      calculateCorrectCutPlane(cutStart, cutEnd);
      setInterMode('rotate');
    });

    function calculateCorrectCutPlane(p1, p2) {
      const ray1 = getRayFromScreen(p1.x, p1.y);
      const ray2 = getRayFromScreen(p2.x, p2.y);

      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2;
      const midRay = getRayFromScreen(midX, midY);

      const sphereWorldPos = new THREE.Vector3();
      sphereGroup.getWorldPosition(sphereWorldPos);

      const camDir = camera.getWorldDirection(new THREE.Vector3()).negate();
      const frontPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(camDir, sphereWorldPos);
      
      const pointOnPlane = new THREE.Vector3();
      midRay.intersectPlane(frontPlane, pointOnPlane);

      const knifeDir = ray2.direction.clone().sub(ray1.direction).normalize();
      let normal = new THREE.Vector3().crossVectors(knifeDir, ray1.direction).normalize();

      if (normal.dot(camera.position) < 0) {
        normal.negate();
      }

      const worldPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, pointOnPlane);
      const invMatrix = sphereGroup.matrixWorld.clone().invert();
      currentPlane.copy(worldPlane).applyMatrix4(invMatrix);

      buildSphere();
    }

    function getRayFromScreen(screenX, screenY) {
      const mouse = new THREE.Vector2(
        (screenX / window.innerWidth) * 2 - 1,
        -(screenY / window.innerHeight) * 2 + 1
      );
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      return raycaster.ray;
    }

    // --- 6. UI操作 ---
    window.changeTexture = function(type) {
      currentType = type;
      document.querySelectorAll('.grid-btns .btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + type).classList.add('active');
      buildSphere();
    };

    window.resetCut = function() {
      currentPlane.set(new THREE.Vector3(0, -1, 0), R + 1);
      buildSphere();
    };

    // --- 7. アニメーションループ ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
